services:
    db:
        image: postgres:17.10-alpine
        container_name: juice-journal-db
        restart: unless-stopped
        environment:
            POSTGRES_DB: juice_journal_db
            POSTGRES_USER: juice_journal_usr
            POSTGRES_PASSWORD: juice_journal_pwd
        ports:
            - "5432:5432"
        volumes:
            - pg_data:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

volumes:
    pg_data:
        driver: local
