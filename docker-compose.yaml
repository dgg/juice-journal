services:
  db:
    image: postgres:${PG_VERSION:-18.6-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: juice_journal_db
      POSTGRES_USER: juice_journal_usr
      POSTGRES_PASSWORD: juice_journal_pwd
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrator:
    image: ghcr.io/amacneil/dbmate:${DBMATE_VERSION:-2.35.1}
    restart: no
    environment:
      DATABASE_URL: postgres://juice_journal_usr:juice_journal_pwd@db:5432/juice_journal_db?sslmode=disable
      DBMATE_NO_DUMP_SCHEMA: true
    volumes:
      - ./db:/db
    command: up
    depends_on:
      db:
        condition: service_healthy

  idp:
    image: mockserver/mockserver:${MOCKSERVER_VERSION:-5.15.0}
    ports:
      - "8080:1080"
    environment:
      MOCKSERVER_LOG_LEVEL: INFO
      MOCKSERVER_INITIALIZATION_JSON_PATH: /opt/mocks/weather.json
    volumes:
      - ./data/mocks:/opt/mocks

  idp-init:
    image: curlimages/curl:${CURL_IMAGE_TAG:-8.22.0}
    restart: no
    depends_on:
      idp:
        condition: service_healthy
    command:
      - "sh"
      - "-c"
      - >
        curl -s -X PUT "http://idp:1080/mockserver/oidc"
        -H "Content-Type: application/json"
        -d '{
          "issuer": "http://localhost:8080",
          "clientId": "juice-journal-dev",
          "clientSecret": "dev-secret",
          "audience": "juice-journal-api",
          "scopes": ["openid","email","profile"],
          "signingAlgorithm": "RS256",
          "tokenExpirySeconds": 3600,
          "opaqueAccessToken": true,
          "additionalClaims": {
            "sub": "1234567890",
            "email": "jj@example.com",
            "email_verified": true,
            "name": "Dev User"
          }
        }'

  juice-journal:
    profiles:
      - app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUN_IMAGE_TAG: ${BUN_IMAGE_TAG:-1.4.2-distroless}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://juice_journal_usr:juice_journal_pwd@db:5432/juice_journal_db?sslmode=disable
      NODE_ENV: production
      OAUTH_ISSUER_BASE_URL: ${OAUTH_ISSUER_BASE_URL:-http://idp:1080}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      GOOGLE_WEB_CLIENT_SECRET: ${GOOGLE_WEB_CLIENT_SECRET:-}
      GOOGLE_WEB_REDIRECT_URI: ${GOOGLE_WEB_REDIRECT_URI:-http://localhost:3000/auth/google/callback}
      ALLOWED_GOOGLE_EMAILS: ${ALLOWED_GOOGLE_EMAILS:-dgon@gmail.com}
      ALLOWED_SERVICE_ACCOUNTS: ${ALLOWED_SERVICE_ACCOUNTS:-juice-journal-importer@dev.iam.gserviceaccount.com}
      JJ_SECRET: ${JJ_SECRET:-dev-secret-change-me}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://localhost:3000/api/health');process.exit(r.ok?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pg_data:
    driver: local
