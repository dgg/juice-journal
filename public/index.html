<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/picocss/2.1.1/pico.min.css"
		integrity="sha512-+4kjFgVD0n6H3xt19Ox84B56MoS7srFn60tgdWFuO4hemtjhySKyW4LnftYZn46k3THUEiTTsbVjrHai+0MOFw=="
		crossorigin="anonymous" referrerpolicy="no-referrer" />
	<title>Hello world!</title>
</head>

<body>
	<main class="container">
		<form>

			<div class="grid">
				<label>
					First name
					<input name="first_name" placeholder="First name" autocomplete="given-name" />
					<small id="first_name-error"></small>
				</label>
				<label>
					Email
					<input type="email" name="email" placeholder="Email" autocomplete="email" aria-invalid="true"
						aria-errormessage="email-error" />
					<small id="email-error">email!!</small>
				</label>

				<label>Cuisine<select name="favorite-cuisine"
						required aria-invalid="true"
						aria-errormessage="cuisine-error">
						<option selected disabled value="">
							Select your favorite cuisine...
						</option>
						<option value="it">Italian</option>
						<option value="jp">Japanese</option>
						<option value="in">Indian</option>
						<option value="ta">Thai</option>
						<option value="fr">French</option>
					</select><small id="cuisine-error">cuisine!!</small></label>

			</div>
			<div class="grid">
				<label>
					Last name
					<input name="last_name" placeholder="Last name" autocomplete="family-name" />
					<small></small>
				</label>
				<label>
					Bar
					<input name="bar" placeholder="Bar" autocomplete="off" aria-invalid="true" aria-errormessage="bar-error" />
					<small id="bar-error">foo</small>
				</label>
			</div>

			<button type="submit">Subscribe</button>
		</form>
	</main>
</body>

</html>
