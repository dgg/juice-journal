services:
  db:
    image: postgres:${PG_VERSION:-18.6-alpine}
    tmpfs: /var/lib/pgdata
    environment:
      POSTGRES_DB: ${DB_DB}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/pgdata
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrator:
    image: ghcr.io/amacneil/dbmate:${DBMATE_VERSION:-2.35.1}
    restart: no
    environment:
      DATABASE_URL: postgres://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_DB}?sslmode=disable
      DBMATE_NO_DUMP_SCHEMA: true
    volumes:
      - ../db:/db
    command: up
    depends_on:
      db:
        condition: service_healthy
